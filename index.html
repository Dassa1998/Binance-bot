<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binance Algorithmic Futures Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.08); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen pb-12">
    
    <header class="border-b border-slate-800 bg-slate-900/50 sticky top-0 z-50 backdrop-blur-md">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="h-9 w-9 rounded-lg bg-yellow-500/10 border border-yellow-500/30 flex items-center justify-center text-yellow-500 font-bold">
                    <i class="fa-solid fa-bolt"></i>
                </div>
                <div>
                    <h1 class="text-base font-bold tracking-wide text-white">PRO SCALPER <span class="text-xs text-yellow-500 bg-yellow-500/10 px-2 py-0.5 rounded border border-yellow-500/20">v2.4 REAL</span></h1>
                </div>
            </div>
            <div class="flex items-center gap-2 px-3 py-1.5 rounded-full bg-slate-900 border border-slate-800">
                <span id="status-ping" class="h-2.5 w-2.5 rounded-full bg-red-500"></span>
                <span id="bot-status" class="text-xs font-semibold text-slate-400 font-mono">OFFLINE</span>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 mt-6 space-y-6">
        
        <section class="glass-panel rounded-2xl p-6">
            <h2 class="text-sm font-semibold uppercase text-slate-300 mb-4"><i class="fa-solid fa-sliders text-yellow-500 mr-2"></i>Terminal Configuration</h2>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Binance API Key</label>
                    <input type="text" id="api-key" placeholder="Enter API Key" class="w-full bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-xs text-yellow-400">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Binance Secret Key</label>
                    <input type="password" id="secret-key" placeholder="Enter Secret Key" class="w-full bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-xs text-yellow-400">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Network</label>
                    <select id="network-type" class="w-full bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-xs text-slate-200">
                        <option value="testnet">Binance Testnet (Demo)</option>
                        <option value="mainnet">Binance Mainnet (Real Trading)</option>
                    </select>
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Leverage</label>
                    <input type="number" id="leverage" value="10" class="w-full bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-xs text-white">
                </div>
                <div>
                    <label class="block text-xs text-slate-400 mb-1">Margin Per Trade (USDT)</label>
                    <input type="number" id="margin" value="2" class="w-full bg-slate-900 border border-slate-800 rounded-xl p-2.5 text-xs text-white">
                </div>
                <div class="flex items-end">
                    <button onclick="startBot()" class="w-full bg-yellow-500 hover:bg-yellow-400 text-slate-950 font-bold py-2.5 rounded-xl text-xs uppercase transition">
                        Initialize Engine
                    </button>
                </div>
            </div>
        </section>

        <section class="grid grid-cols-2 gap-4">
            <div class="glass-panel p-5 rounded-2xl">
                <span class="text-xs text-slate-400 uppercase">USDT Balance</span>
                <h3 id="balance" class="text-2xl font-bold font-mono text-emerald-400 mt-1">$0.00</h3>
            </div>
            <div class="glass-panel p-5 rounded-2xl">
                <span class="text-xs text-slate-400 uppercase">Active Positions</span>
                <h3 id="active-positions" class="text-2xl font-bold font-mono text-sky-400 mt-1">0</h3>
            </div>
        </section>

        <section class="glass-panel rounded-2xl overflow-hidden">
            <div class="px-6 py-4 border-b border-slate-800">
                <h2 class="text-sm font-semibold text-slate-300 uppercase">Active Market Positions</h2>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs font-mono">
                    <thead class="bg-slate-900/60 text-slate-400 border-b border-slate-800">
                        <tr>
                            <th class="p-3">Symbol</th>
                            <th class="p-3">Amount</th>
                            <th class="p-3">Entry Price</th>
                            <th class="p-3">PnL (USDT)</th>
                        </tr>
                    </thead>
                    <tbody id="positions-table" class="divide-y divide-slate-800/40">
                        <tr><td colspan="4" class="p-4 text-center text-slate-500">Engine Disconnected</td></tr>
                    </tbody>
                </table>
            </div>
        </section>

    </main>

    <script>
        let ws;
        function startBot() {
            const apiKey = document.getElementById('api-key').value;
            const secretKey = document.getElementById('secret-key').value;
            const network = document.getElementById('network-type').value;
            const leverage = document.getElementById('leverage').value;
            const margin = document.getElementById('margin').value;

            if(!apiKey || !secretKey) {
                alert("Please enter API Key and Secret Key!");
                return;
            }

            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}/ws`);

            ws.onopen = () => {
                document.getElementById('bot-status').innerText = 'ENGINE ACTIVE';
                document.getElementById('bot-status').className = 'text-xs font-semibold text-emerald-400 font-mono';
                document.getElementById('status-ping').className = 'h-2.5 w-2.5 rounded-full bg-emerald-500 animate-pulse';
                
                setInterval(() => {
                    ws.send(JSON.stringify({
                        action: "INIT_CONFIG",
                        apiKey: apiKey,
                        secretKey: secretKey,
                        network: network,
                        leverage: leverage,
                        margin: margin
                    }));
                }, 1000);
            };

            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                document.getElementById('balance').innerText = `$${parseFloat(data.balance).toFixed(2)}`;
                document.getElementById('active-positions').innerText = data.positions.length;
                
                const tbody = document.getElementById('positions-table');
                if(data.positions.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-slate-500">Scanning market for trades...</td></tr>`;
                } else {
                    tbody.innerHTML = data.positions.map(p => `
                        <tr>
                            <td class="p-3 font-bold text-slate-200">${p.symbol}</td>
                            <td class="p-3">${p.amount}</td>
                            <td class="p-3">$${p.entryPrice}</td>
                            <td class="p-3 ${p.unrealizedProfit >= 0 ? 'text-emerald-400' : 'text-rose-400'} font-bold">
                                $${p.unrealizedProfit.toFixed(4)}
                            </td>
                        </tr>
                    `).join('');
                }
            };
        }
    </script>
</body>
</html>
