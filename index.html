<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRO SCALPER v3.0 - Advanced Trading Console</title>
    <style>
        :root {
            --bg-dark: #0b0e14;
            --card-bg: #151a23;
            --accent-yellow: #f0b90b;
            --text-main: #f0f0f0;
            --text-sub: #848e9c;
            --green: #0ecb81;
            --red: #f6465d;
            --border: #2b313a;
        }
        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 15px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 15px;
        }
        .status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }
        .status-active { background: rgba(14, 203, 129, 0.2); color: var(--green); }
        .status-stopped { background: rgba(246, 70, 93, 0.2); color: var(--red); }
        .card {
            background: var(--card-bg);
            padding: 18px;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-bottom: 15px;
        }
        h3 { margin-top: 0; color: var(--accent-yellow); font-size: 16px; margin-bottom: 15px;}
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 12px; color: var(--text-sub); margin-bottom: 5px; }
        input, select {
            width: 100%;
            padding: 10px;
            background: #0b0e14;
            border: 1px solid var(--border);
            color: #fff;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .row { display: flex; gap: 10px; }
        .row .form-group { flex: 1; }
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            margin-top: 5px;
        }
        .btn-start { background: var(--green); color: #000; }
        .btn-stop { background: var(--red); color: #fff; }
        .btn-panic { background: #d9534f; color: #fff; margin-top: 10px; }
        .stats-grid { display: flex; gap: 10px; margin-bottom: 15px; }
        .stat-box {
            flex: 1;
            background: var(--card-bg);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid var(--border);
            text-align: center;
        }
        .stat-val { font-size: 18px; font-weight: bold; margin-top: 5px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
        th, td { padding: 8px; text-align: left; border-bottom: 1px solid var(--border); }
        th { color: var(--text-sub); }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div><strong>PRO SCALPER v3.0</strong></div>
        <div id="statusBadge" class="status-badge status-stopped">STOPPED</div>
    </div>

    <div class="stats-grid">
        <div class="stat-box">
            <div style="font-size:12px; color:var(--text-sub);">USDT BALANCE</div>
            <div id="balanceVal" class="stat-val" style="color:var(--green);">$0.00</div>
        </div>
        <div class="stat-box">
            <div style="font-size:12px; color:var(--text-sub);">ACTIVE POSITIONS</div>
            <div id="posVal" class="stat-val">0</div>
        </div>
    </div>

    <div class="card">
        <h3>⚙️ BOT CONTROL & CONFIG</h3>
        <div class="form-group">
            <label>Binance API Key</label>
            <input type="text" id="apiKey" placeholder="Enter API Key">
        </div>
        <div class="form-group">
            <label>Binance Secret Key</label>
            <input type="password" id="secretKey" placeholder="Enter Secret Key">
        </div>
        <div class="row">
            <div class="form-group">
                <label>Network</label>
                <select id="network">
                    <option value="testnet">Testnet (Demo)</option>
                    <option value="mainnet">Mainnet (Real)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Timeframe</label>
                <select id="timeframe">
                    <option value="1m">1 Minute</option>
                    <option value="3m">3 Minutes</option>
                    <option value="5m">5 Minutes</option>
                </select>
            </div>
        </div>
        <div class="row">
            <div class="form-group">
                <label>Leverage</label>
                <input type="number" id="leverage" value="10">
            </div>
            <div class="form-group">
                <label>Margin / Trade ($)</label>
                <input type="number" id="margin" value="2.0">
            </div>
        </div>
        <div class="row">
            <div class="form-group">
                <label>Take Profit (%)</label>
                <input type="number" id="tp" value="0.8" step="0.1">
            </div>
            <div class="form-group">
                <label>Stop Loss (%)</label>
                <input type="number" id="sl" value="0.4" step="0.1">
            </div>
        </div>

        <button id="btnStart" class="btn btn-start" onclick="toggleBot('START')">▶ START BOT</button>
        <button id="btnStop" class="btn btn-stop" onclick="toggleBot('STOP')" style="display:none;">⏹ STOP BOT</button>
        <button class="btn btn-panic" onclick="panicClose()">🚨 CLOSE ALL POSITIONS</button>
    </div>

    <div class="card">
        <h3>📊 ACTIVE POSITIONS</h3>
        <table>
            <thead>
                <tr>
                    <th>Symbol</th>
                    <th>Amt</th>
                    <th>Entry</th>
                    <th>PnL ($)</th>
                </tr>
            </thead>
            <tbody id="posTable">
                <tr><td colspan="4" style="text-align:center; color:var(--text-sub);">No active positions</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    let ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws');
    let isRunning = false;

    ws.onmessage = (event) => {
        let data = JSON.parse(event.data);
        document.getElementById('balanceVal').innerText = '$' + parseFloat(data.balance).toFixed(2);
        document.getElementById('posVal').innerText = data.positions.length;
        
        let badge = document.getElementById('statusBadge');
        if (data.status === 'ACTIVE') {
            badge.innerText = 'ENGINE RUNNING';
            badge.className = 'status-badge status-active';
            document.getElementById('btnStart').style.display = 'none';
            document.getElementById('btnStop').style.display = 'block';
        } else {
            badge.innerText = 'STOPPED';
            badge.className = 'status-badge status-stopped';
            document.getElementById('btnStart').style.display = 'block';
            document.getElementById('btnStop').style.display = 'none';
        }

        let table = document.getElementById('posTable');
        if (data.positions.length === 0) {
            table.innerHTML = '<tr><td colspan="4" style="text-align:center; color:var(--text-sub);">No active positions</td></tr>';
        } else {
            table.innerHTML = '';
            data.positions.forEach(p => {
                let pnlColor = p.unrealizedProfit >= 0 ? 'var(--green)' : 'var(--red)';
                table.innerHTML += `<tr>
                    <td><b>${p.symbol}</b></td>
                    <td>${p.amount}</td>
                    <td>$${p.entryPrice}</td>
                    <td style="color:${pnlColor}; font-weight:bold;">$${parseFloat(p.unrealizedProfit).toFixed(2)}</td>
                </tr>`;
            });
        }
    };

    function toggleBot(action) {
        let payload = {
            action: action,
            apiKey: document.getElementById('apiKey').value,
            secretKey: document.getElementById('secretKey').value,
            network: document.getElementById('network').value,
            timeframe: document.getElementById('timeframe').value,
            leverage: document.getElementById('leverage').value,
            margin: document.getElementById('margin').value,
            tp: document.getElementById('tp').value,
            sl: document.getElementById('sl').value
        };
        ws.send(JSON.stringify(payload));
    }

    function panicClose() {
        if(confirm("Are you sure you want to CLOSE ALL POSITIONS instantly?")) {
            ws.send(JSON.stringify({action: 'PANIC_CLOSE'}));
        }
    }
</script>
</body>
</html>
